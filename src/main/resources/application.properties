spring.application.name=conexion-postgres

# --- Conexión a PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/tienda_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Falla rápido (5 s) si la base de datos no responde
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# --- JPA / Hibernate ---
# La tabla se crea con el script SQL, Hibernate no la modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Evita que Hibernate consulte la BD al arrancar, así el error de conexión
# lo reporta nuestro verificador y no un stacktrace de Hibernate
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
